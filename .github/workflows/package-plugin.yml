name: Package QGIS Plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate plugin files
        shell: bash
        run: |
          set -euo pipefail
          test -f qgis_horizontal_legend/metadata.txt
          test -f qgis_horizontal_legend/__init__.py
          test -f qgis_horizontal_legend/plugin.py
          test -f qgis_horizontal_legend/icon.svg
          grep -q '^name=Horizontal Legend$' qgis_horizontal_legend/metadata.txt
          grep -q '^version=' qgis_horizontal_legend/metadata.txt
          python -m compileall -q qgis_horizontal_legend

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist
          mkdir -p build/qgis_horizontal_legend dist
          rsync -a \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            qgis_horizontal_legend/ build/qgis_horizontal_legend/
          cd build
          zip -r ../dist/qgis-horizontal-legend.zip qgis_horizontal_legend

      - name: Upload packaged plugin
        uses: actions/upload-artifact@v4
        with:
          name: qgis-horizontal-legend
          path: dist/qgis-horizontal-legend.zip
          if-no-files-found: error

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/qgis-horizontal-legend.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Horizontal Legend ${GITHUB_REF_NAME}" \
            --generate-notes
